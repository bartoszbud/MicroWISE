---
name: Detect Changes

on:
  push:
    paths:
      - "services/**"

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_changed: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            services/frontend:
              - 'services/frontend/**'
            services/auth-service:
              - 'services/auth-service/**'
            services/account:
              - 'services/account/**'
  
  test:
    needs: detect
    if: ${{ needs.detect.outputs.has_changed != '[]' && github.ref != 'refs/heads/main'}}
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.has_changed) }}
    uses: ./.github/workflows/test.yml
    with:
      service_path: ${{ matrix.service }}
  
  build-test-publish:
    needs: detect
    if: ${{ needs.detect.outputs.has_changed != '[]' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.has_changed) }}
    uses: ./.github/workflows/build-test-publish.yml
    with:
      service_path: ${{ matrix.service }}
